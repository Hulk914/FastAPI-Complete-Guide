[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".venv*", "artifacts"]
cache-dir = ".cache/ruff"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]
cache_dir = ".cache/pytest"

[tool.coverage.run]
source = ["app"]
omit = ["*/__init__.py"]
data_file = ".cache/coverage"

[tool.coverage.report]
show_missing = true
fail_under = 90
